<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouTube 舆情分析工具</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f6f8;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 40px auto 80px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .search-box {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    input {
      flex: 1;
      height: 48px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #222;
    }

    button {
      height: 48px;
      padding: 0 24px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      color: #666;
      display: none;
    }

    .error {
      background: #fff0f0;
      color: #c62828;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      white-space: pre-wrap;
    }

    .section {
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .video-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .video-channel {
      color: #666;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 12px;
    }

    .stat {
      background: #f7f7f7;
      padding: 18px;
      border-radius: 12px;
    }

    .stat-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
    }

    .sentiment-card {
      margin-top: 24px;
    }

    .sentiment-label {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .sentiment-reason {
      color: #666;
      line-height: 1.7;
    }

    .sentiment-bars {
      margin-top: 24px;
    }

    .sentiment-item {
      margin-bottom: 18px;
    }

    .sentiment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .bar {
      width: 100%;
      height: 12px;
      background: #eee;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-inner {
      height: 100%;
      border-radius: 20px;
    }

    .positive {
      background: #35a853;
    }

    .neutral {
      background: #999;
    }

    .negative {
      background: #e74c3c;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 24px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 20px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      background: #f1f2f4;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 14px;
    }

    .list {
      margin: 0;
      padding-left: 20px;
    }

    .list li {
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .quote {
      background: #f7f7f7;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      line-height: 1.6;
      color: #444;
    }

    .summary {
      font-size: 16px;
      line-height: 1.9;
      color: #444;
    }

    .empty {
      color: #999;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {

      .container {
        width: calc(100% - 20px);
        margin-top: 20px;
      }

      h1 {
        font-size: 26px;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }

      .video-title {
        font-size: 20px;
      }
    }
  </style>
</head>


<body>

<div class="container">

  <h1>YouTube 舆情分析工具</h1>

  <div class="subtitle">
    输入 YouTube 视频链接，自动获取评论并使用 AI 分析用户舆情
  </div>


  <!-- 搜索区域 -->

  <div class="search-box">

    <div class="input-row">

      <input
        id="youtubeUrl"
        type="text"
        placeholder="请输入 YouTube 视频链接，例如：https://www.youtube.com/watch?v=xxxxx"
      >

      <button
        id="analyzeButton"
        onclick="startAnalysis()"
      >
        开始分析
      </button>

    </div>


    <div
      id="status"
      class="status"
    >
      正在分析，请稍候……
    </div>

  </div>


  <div
    id="error"
    class="error"
  ></div>


  <!-- 分析结果 -->

  <div
    id="result"
    class="hidden"
  >


    <!-- 视频信息 -->

    <div class="section">

      <div class="card">

        <div
          id="videoTitle"
          class="video-title"
        ></div>

        <div
          id="videoChannel"
          class="video-channel"
        ></div>


        <div class="stats">

          <div class="stat">

            <div class="stat-label">
              播放量
            </div>

            <div
              id="views"
              class="stat-value"
            >
              -
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              YouTube 评论数
            </div>

            <div
              id="youtubeComments"
              class="stat-value"
            >
              -
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              本次分析评论
            </div>

            <div
              id="analyzedComments"
              class="stat-value"
            >
              -
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              点赞数
            </div>

            <div
              id="likes"
              class="stat-value"
            >
              -
            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- 整体舆情 -->

    <div class="section">

      <div class="card sentiment-card">

        <h2>
          整体舆情
        </h2>

        <div
          id="sentimentLabel"
          class="sentiment-label"
        ></div>

        <div
          id="sentimentReason"
          class="sentiment-reason"
        ></div>


        <div class="sentiment-bars">


          <!-- 正面 -->

          <div class="sentiment-item">

            <div class="sentiment-header">

              <span>
                正面
              </span>

              <span
                id="positivePercent"
              >
                0%
              </span>

            </div>

            <div class="bar">

              <div
                id="positiveBar"
                class="bar-inner positive"
              ></div>

            </div>

          </div>


          <!-- 中性 -->

          <div class="sentiment-item">

            <div class="sentiment-header">

              <span>
                中性
              </span>

              <span
                id="neutralPercent"
              >
                0%
              </span>

            </div>

            <div class="bar">

              <div
                id="neutralBar"
                class="bar-inner neutral"
              ></div>

            </div>

          </div>


          <!-- 负面 -->

          <div class="sentiment-item">

            <div class="sentiment-header">

              <span>
                负面
              </span>

              <span
                id="negativePercent"
              >
                0%
              </span>

            </div>

            <div class="bar">

              <div
                id="negativeBar"
                class="bar-inner negative"
              ></div>

            </div>

          </div>


        </div>

      </div>

    </div>


    <!-- 关键词 -->

    <div class="section">

      <div class="card">

        <h2>
          高频关键词
        </h2>

        <div
          id="keywords"
          class="tag-list"
        ></div>

      </div>

    </div>


    <!-- 两列信息 -->

    <div class="grid">


      <!-- 用户认可 -->

      <div class="card">

        <h2>
          用户主要认可
        </h2>

        <ul
          id="positivePoints"
          class="list"
        ></ul>

      </div>


      <!-- 用户不满 -->

      <div class="card">

        <h2>
          用户主要不满
        </h2>

        <ul
          id="negativePoints"
          class="list"
        ></ul>

      </div>


      <!-- 功能反馈 -->

      <div class="card">

        <h2>
          功能反馈
        </h2>

        <ul
          id="featureFeedback"
          class="list"
        ></ul>

      </div>


      <!-- 价格反馈 -->

      <div class="card">

        <h2>
          价格反馈
        </h2>

        <ul
          id="priceFeedback"
          class="list"
        ></ul>

      </div>


      <!-- 竞品 -->

      <div class="card">

        <h2>
          竞品提及
        </h2>

        <ul
          id="competitors"
          class="list"
        ></ul>

      </div>


      <!-- 正面评论 -->

      <div class="card">

        <h2>
          代表性正面评论
        </h2>

        <div
          id="positiveComments"
        ></div>

      </div>


      <!-- 负面评论 -->

      <div class="card">

        <h2>
          代表性负面评论
        </h2>

        <div
          id="negativeComments"
        ></div>

      </div>


    </div>


    <!-- AI 总结 -->

    <div
      class="section"
      style="margin-top:24px;"
    >

      <div class="card">

        <h2>
          AI 舆情总结
        </h2>

        <div
          id="summary"
          class="summary"
        ></div>

      </div>

    </div>


  </div>

</div>


<script>


/*************************************************
 * Apps Script Web App 地址
 *************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycby8IFNRuudxFMTVomssAwuAjInVeapOtBlQn7NcA2HhiuQ8tAdPBilyycpM2Am3iQ7g/exec';


/*************************************************
 * 获取 YouTube Video ID
 *************************************************/

function getYouTubeVideoId(url) {

  if (!url) {
    return null;
  }


  // youtube.com/watch?v=
  const watchMatch =
    url.match(
      /[?&]v=([^&]+)/
    );


  if (watchMatch) {
    return watchMatch[1];
  }


  // youtu.be/
  const shortMatch =
    url.match(
      /youtu\.be\/([^?&/]+)/
    );


  if (shortMatch) {
    return shortMatch[1];
  }


  return null;

}


/*************************************************
 * 开始分析
 *************************************************/

async function startAnalysis() {


  const input =
    document.getElementById(
      'youtubeUrl'
    );


  const button =
    document.getElementById(
      'analyzeButton'
    );


  const status =
    document.getElementById(
      'status'
    );


  const error =
    document.getElementById(
      'error'
    );


  const result =
    document.getElementById(
      'result'
    );


  const url =
    input.value.trim();


  // 清空状态

  error.style.display =
    'none';

  result.classList.add(
    'hidden'
  );


  // 检查链接

  const videoId =
    getYouTubeVideoId(
      url
    );


  if (!videoId) {

    error.textContent =
      '请输入正确的 YouTube 视频链接。';

    error.style.display =
      'block';

    return;

  }


  // 开始加载

  button.disabled =
    true;

  button.textContent =
    '分析中...';

  status.style.display =
    'block';


  try {


    status.textContent =
      '正在获取 YouTube 视频和评论，请稍候……';


    const requestUrl =
      API_URL +
      '?videoId=' +
      encodeURIComponent(
        videoId
      ) +
      '&analyze=true';


    const response =
      await fetch(
        requestUrl
      );


    if (!response.ok) {

      throw new Error(
        '服务器请求失败：' +
        response.status
      );

    }


    status.textContent =
      '正在生成 AI 舆情报告……';


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        '分析失败'
      );

    }


    renderResult(
      data
    );


    result.classList.remove(
      'hidden'
    );


    status.textContent =
      '分析完成';


  } catch (err) {


    console.error(
      err
    );


    error.textContent =
      '分析失败：\n' +
      err.message;


    error.style.display =
      'block';


    status.style.display =
      'none';


  } finally {


    button.disabled =
      false;

    button.textContent =
      '开始分析';

  }

}


/*************************************************
 * 格式化数字
 *************************************************/

function formatNumber(
  number
) {

  if (
    number === undefined ||
    number === null
  ) {

    return '-';

  }


  return Number(
    number
  ).toLocaleString();

}


/*************************************************
 * HTML 安全处理
 *************************************************/

function escapeHtml(
  text
) {

  if (
    text === undefined ||
    text === null
  ) {

    return '';

  }


  return String(text)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/*************************************************
 * 渲染列表
 *************************************************/

function renderList(
  elementId,
  items
) {

  const element =
    document.getElementById(
      elementId
    );


  if (
    !items ||
    items.length === 0
  ) {

    element.innerHTML =
      '<li class="empty">暂无明显反馈</li>';

    return;

  }


  element.innerHTML =
    items
      .map(function(item) {

        return (
          '<li>' +
          escapeHtml(item) +
          '</li>'
        );

      })
      .join('');

}


/*************************************************
 * 渲染评论
 *************************************************/

function renderQuotes(
  elementId,
  comments
) {

  const element =
    document.getElementById(
      elementId
    );


  if (
    !comments ||
    comments.length === 0
  ) {

    element.innerHTML =
      '<div class="empty">暂无代表性评论</div>';

    return;

  }


  element.innerHTML =
    comments
      .map(function(comment) {

        return (
          '<div class="quote">' +
          escapeHtml(comment) +
          '</div>'
        );

      })
      .join('');

}


/*************************************************
 * 渲染关键词
 *************************************************/

function renderKeywords(
  keywords
) {

  const element =
    document.getElementById(
      'keywords'
    );


  if (
    !keywords ||
    keywords.length === 0
  ) {

    element.innerHTML =
      '<span class="empty">暂无明显关键词</span>';

    return;

  }


  element.innerHTML =
    keywords
      .map(function(keyword) {

        return (
          '<span class="tag">' +
          escapeHtml(keyword) +
          '</span>'
        );

      })
      .join('');

}


/*************************************************
 * 渲染完整结果
 *************************************************/

function renderResult(
  data
) {


  const video =
    data.video || {};

  const analysis =
    data.analysis || {};


  /***************
   * 视频信息
   ***************/

  document.getElementById(
    'videoTitle'
  ).textContent =
    video.title ||
    '-';


  document.getElementById(
    'videoChannel'
  ).textContent =
    '频道：' +
    (
      video.channel ||
      '-'
    );


  document.getElementById(
    'views'
  ).textContent =
    formatNumber(
      video.views
    );


  document.getElementById(
    'youtubeComments'
  ).textContent =
    formatNumber(
      video.comments
    );


  document.getElementById(
    'analyzedComments'
  ).textContent =
    formatNumber(
      data.commentCount
    );


  document.getElementById(
    'likes'
  ).textContent =
    formatNumber(
      video.likes
    );


  /***************
   * 整体舆情
   ***************/

  const overall =
    analysis.overall_sentiment ||
    {};


  document.getElementById(
    'sentimentLabel'
  ).textContent =
    overall.label ||
    '暂无判断';


  document.getElementById(
    'sentimentReason'
  ).textContent =
    overall.reason ||
    '暂无分析原因';


  /***************
   * 情感比例
   ***************/

  const distribution =
    analysis.sentiment_distribution ||
    {};


  const positive =
    Number(
      distribution.positive || 0
    );


  const neutral =
    Number(
      distribution.neutral || 0
    );


  const negative =
    Number(
      distribution.negative || 0
    );


  document.getElementById(
    'positivePercent'
  ).textContent =
    positive + '%';


  document.getElementById(
    'neutralPercent'
  ).textContent =
    neutral + '%';


  document.getElementById(
    'negativePercent'
  ).textContent =
    negative + '%';


  document.getElementById(
    'positiveBar'
  ).style.width =
    positive + '%';


  document.getElementById(
    'neutralBar'
  ).style.width =
    neutral + '%';


  document.getElementById(
    'negativeBar'
  ).style.width =
    negative + '%';


  /***************
   * 关键词
   ***************/

  renderKeywords(
    analysis.keywords || []
  );


  /***************
   * 用户认可
   ***************/

  renderList(
    'positivePoints',
    analysis.positive_points || []
  );


  /***************
   * 用户不满
   ***************/

  renderList(
    'negativePoints',
    analysis.negative_points || []
  );


  /***************
   * 功能反馈
   ***************/

  renderList(
    'featureFeedback',
    analysis.feature_feedback || []
  );


  /***************
   * 价格反馈
   ***************/

  renderList(
    'priceFeedback',
    analysis.price_feedback || []
  );


  /***************
   * 竞品
   ***************/

  renderList(
    'competitors',
    analysis.competitors || []
  );


  /***************
   * 正面评论
   ***************/

  renderQuotes(
    'positiveComments',
    analysis.representative_positive || []
  );


  /***************
   * 负面评论
   ***************/

  renderQuotes(
    'negativeComments',
    analysis.representative_negative || []
  );


  /***************
   * AI 总结
   ***************/

  document.getElementById(
    'summary'
  ).textContent =
    analysis.summary ||
    '暂无总结';

}

</script>

</body>
</html>
