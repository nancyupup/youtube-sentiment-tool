<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouTube 舆情分析工具</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #333;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      margin-top: 15px;
      color: #666;
    }

    .error {
      display: none;
      background: #fff1f1;
      color: #c00;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }

    #result {
      display: none;
    }

    .video-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .video-meta {
      color: #666;
      line-height: 1.8;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .stat {
      background: #f7f7f7;
      padding: 18px;
      border-radius: 12px;
    }

    .stat-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .comments {
      margin-top: 20px;
    }

    .comment {
      border-top: 1px solid #eee;
      padding: 16px 0;
    }

    .comment:first-child {
      border-top: none;
    }

    .comment-author {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .comment-text {
      line-height: 1.6;
    }

    .comment-meta {
      color: #999;
      font-size: 13px;
      margin-top: 6px;
    }

    @media (max-width: 700px) {
      .input-row {
        flex-direction: column;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>YouTube 舆情分析工具</h1>

  <div class="subtitle">
    输入 YouTube 视频链接，获取视频信息与用户评论
  </div>

  <div class="card">

    <div class="input-row">

      <input
        id="youtubeUrl"
        type="text"
        placeholder="粘贴 YouTube 视频链接，例如 https://www.youtube.com/watch?v=..."
      >

      <button id="analyzeBtn" onclick="analyzeVideo()">
        开始分析
      </button>

    </div>

    <div id="loading" class="loading">
      正在获取 YouTube 数据，请稍候……
    </div>

    <div id="error" class="error"></div>

  </div>

  <div id="result">

    <div class="card">

      <div id="videoTitle" class="video-title"></div>

      <div id="videoMeta" class="video-meta"></div>

      <div class="stats">

        <div class="stat">
          <div class="stat-label">观看次数</div>
          <div id="views" class="stat-value">-</div>
        </div>

        <div class="stat">
          <div class="stat-label">点赞数</div>
          <div id="likes" class="stat-value">-</div>
        </div>

        <div class="stat">
          <div class="stat-label">评论数</div>
          <div id="commentsCount" class="stat-value">-</div>
        </div>

        <div class="stat">
          <div class="stat-label">本次获取评论</div>
          <div id="fetchedComments" class="stat-value">-</div>
        </div>

      </div>

    </div>

    <div class="card">

      <h2>用户评论</h2>

      <div id="comments" class="comments"></div>

    </div>

  </div>

</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycby8IFNRuudxFMTVomssAwuAjInVeapOtBlQn7NcA2HhiuQ8tAdPBilyycpM2Am3iQ7g/exec";


function extractVideoId(url) {

  try {

    const parsedUrl = new URL(url);

    if (parsedUrl.hostname.includes("youtu.be")) {

      return parsedUrl.pathname.substring(1);

    }

    if (parsedUrl.hostname.includes("youtube.com")) {

      return parsedUrl.searchParams.get("v");

    }

    return null;

  } catch (error) {

    return null;

  }

}


async function analyzeVideo() {

  const input = document.getElementById("youtubeUrl");
  const button = document.getElementById("analyzeBtn");

  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const result = document.getElementById("result");

  const url = input.value.trim();

  errorBox.style.display = "none";
  result.style.display = "none";

  if (!url) {

    errorBox.textContent = "请先输入 YouTube 视频链接。";
    errorBox.style.display = "block";

    return;

  }

  const videoId = extractVideoId(url);

  if (!videoId) {

    errorBox.textContent =
      "无法识别这个 YouTube 链接，请检查链接格式。";

    errorBox.style.display = "block";

    return;

  }

  button.disabled = true;
  loading.style.display = "block";

  try {

    const response =
      await fetch(
        API_URL + "?videoId=" + encodeURIComponent(videoId)
      );

    const data = await response.json();

    if (!data.success) {

      throw new Error(
        data.error || "获取 YouTube 数据失败"
      );

    }

    displayResult(data);

  } catch (error) {

    errorBox.textContent =
      "分析失败：" + error.message;

    errorBox.style.display = "block";

  } finally {

    button.disabled = false;
    loading.style.display = "none";

  }

}


function displayResult(data) {

  const video = data.video;
  const comments = data.comments || [];

  document.getElementById("videoTitle").textContent =
    video.title;

  document.getElementById("videoMeta").innerHTML =
    "频道：" + escapeHtml(video.channel) +
    "<br>" +
    "发布时间：" + formatDate(video.publishedAt);

  document.getElementById("views").textContent =
    formatNumber(video.views);

  document.getElementById("likes").textContent =
    formatNumber(video.likes);

  document.getElementById("commentsCount").textContent =
    formatNumber(video.comments);

  document.getElementById("fetchedComments").textContent =
    comments.length;

  const commentsContainer =
    document.getElementById("comments");

  commentsContainer.innerHTML = "";

  comments.forEach(function(comment) {

    const div = document.createElement("div");

    div.className = "comment";

    div.innerHTML = `
      <div class="comment-author">
        ${escapeHtml(comment.author)}
      </div>

      <div class="comment-text">
        ${escapeHtml(comment.text)}
      </div>

      <div class="comment-meta">
        👍 ${comment.likes || 0}
      </div>
    `;

    commentsContainer.appendChild(div);

  });

  document.getElementById("result").style.display = "block";

}


function formatNumber(number) {

  return Number(number || 0).toLocaleString();

}


function formatDate(date) {

  if (!date) return "-";

  return new Date(date).toLocaleString();

}


function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text || "";

  return div.innerHTML;

}

</script>

</body>
</html>
